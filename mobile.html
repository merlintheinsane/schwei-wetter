<style>
/* Schriften liegen im Repo (fonts/) – keine Anfragen an Google */
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}

<style>
:root{
  --bg:#111316; --panel:#181b20; --panel2:#1e2228; --line:#262b33; --tx:#e9ebee; --mut:#8b939d; --dim:#5d646e;
  --g:#3ecf8e; --y:#f5c542; --r:#ef5a5a; --x:#4a5059;
  --acc:#ffb020; --wind:#4fc3f7; --rain:#3d7eff;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --hh:calc(58px + var(--st)); --tb:calc(64px + var(--sb));
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.num{font-family:'Barlow Condensed','Barlow',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.c-g{color:var(--g)}.c-y{color:var(--y)}.c-r{color:var(--r)}.c-x{color:var(--x)}
.bg-g{background:var(--g)}.bg-y{background:var(--y)}.bg-r{background:var(--r)}.bg-x{background:var(--x)}

/* Kopfzeile */
#top{position:fixed;left:0;right:0;top:0;z-index:20;height:var(--hh);padding:var(--st) 12px 0 14px;display:flex;align-items:center;gap:10px;
  background:rgba(17,19,22,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#locBtn{flex:1;min-width:0;display:flex;align-items:center;gap:7px;font-weight:700;font-size:19px;height:44px;text-align:left}
#locBtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#locBtn small{color:var(--mut);font-weight:500;font-size:13px}
#status{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:5px;white-space:nowrap}
#status i{width:7px;height:7px;border-radius:50%;background:var(--g);display:inline-block}
#status.demo i{background:var(--y)}
#topClock{font-size:22px;font-weight:600}
#gear{width:42px;height:42px;border-radius:21px;display:grid;place-items:center;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line);flex:none}

/* Seiten */
#viewport{padding-top:var(--hh);padding-bottom:var(--tb)}
.page{display:none;padding:14px 14px 18px}
.page.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 14px;margin-bottom:12px}
.cardTitle{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
.cardTitle .lg{display:flex;flex-wrap:wrap;gap:10px;text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}
.lg span{display:flex;align-items:center;gap:5px}
.lg b{width:12px;height:3px;border-radius:2px;display:inline-block}
#bigClock{display:none}
#bigDate{font-size:15px;color:var(--mut);margin:0 2px 10px;font-weight:500}

/* Übersicht */
#vdSub{font-size:13px;color:var(--mut);margin:-4px 0 10px;line-height:1.35}
#verdict{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vd{background:var(--panel2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.vd .top{display:flex;align-items:center;gap:10px}
.vd .dot{width:30px;height:30px;border-radius:50%;flex:none;box-shadow:0 0 16px -3px currentColor}
.vd h4{margin:0;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.vd p{margin:0;font-size:19px;font-weight:700;line-height:1.1}
.vd small{display:block;font-size:13px;color:var(--mut);line-height:1.3}
#weekStrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.wk{background:var(--panel2);border-radius:10px;padding:7px 0 8px;text-align:center;cursor:pointer}
.wk span{font-size:12px;color:var(--mut);font-weight:600}
.wk i{display:block;height:7px;border-radius:4px;margin:6px 7px 0}
#nowMain{display:flex;align-items:center;gap:12px}
#nowTemp{font-size:60px;font-weight:600;line-height:1}
#nowDesc{font-size:16px;color:var(--mut)}

<script>
'use strict';
/* ============================================================
   Wetterstation · Schweißwetter — Vorschau
   Live-Daten: Open-Meteo (mehrere Modelle) + DWD-Radar (WMS)
   Fällt auf Demo-Daten zurück, wenn kein Netzzugriff möglich ist.
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');

const MODELS=[
  {id:'icon_seamless',       name:'ICON',  full:'ICON (DWD)',     color:'#4fc3f7'},
  {id:'ecmwf_ifs025',        name:'ECMWF', full:'ECMWF IFS',      color:'#b39ddb'},
  {id:'gfs_seamless',        name:'GFS',   full:'GFS (NOAA)',     color:'#ffd54f'},
  {id:'meteofrance_seamless',name:'MF',    full:'Météo-France',   color:'#f48fb1'}
];
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const STATUS_TX={g:'Gut',y:'Grenzwertig',r:'Ungeeignet',x:'Vorbei'};

/* ---------- Einstellungen ---------- */
const DEF={loc:null,screen:false,start:8,end:19,
  thr:{wind:12,gust:25},zoom:8};
let S=loadSettings();
function loadSettings(){
  try{const s=JSON.parse(localStorage.getItem('ws-settings')||'null');
    if(s){const d=clone(DEF);Object.assign(d,s);const ot=s.thr&&s.thr.MAG?s.thr.MAG:s.thr;d.thr=Object.assign(clone(DEF.thr),ot||{});d.loc=(s.loc&&s.loc.set&&isFinite(s.loc.lat))?s.loc:null;delete d.proc;return d;}
  }catch(e){}
  return clone(DEF);
}
function saveSettings(){try{localStorage.setItem('ws-settings',JSON.stringify(S));}catch(e){}}
function thr(){const t=S.thr,f=S.screen?1.5:1;return{wind:Math.round(t.wind*f),gust:Math.round(t.gust*f)};}

/* ---------- Zeit-Helfer ---------- */
function parseLocal(s){const[d,t]=s.split('T');const[y,m,dd]=d.split('-').map(Number);const[h,mi]=(t||'00:00').split(':').map(Number);return new Date(y,m-1,dd,h,mi);}
const dayKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};
const fmt=(v,d=0)=>v==null||isNaN(v)?'–':Number(v).toFixed(d).replace('.',',');
const compass=d=>['N','NO','O','SO','S','SW','W','NW'][Math.round(((d%360)+360)%360/45)%8];

/* ---------- Daten laden ---------- */
let D=null;
async function getJSON(url,ms=12000){
  const c=new AbortController();const to=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}
  finally{clearTimeout(to);}
}
async function loadLive(){
  const {lat,lon}=S.loc;
  const base='https://api.open-meteo.com/v1/forecast';
  const common=`latitude=${lat}&longitude=${lon}&timezone=Europe%2FBerlin&forecast_days=7&wind_speed_unit=kmh`;
  const mainP=getJSON(`${base}?${common}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,wind_gusts_10m,wind_direction_10m`+
    `&hourly=temperature_2m,dew_point_2m,precipitation_probability,precipitation,wind_speed_10m,wind_gusts_10m,weather_code`+
    `&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max`);
  const modAll=Promise.allSettled(MODELS.map(m=>getJSON(`${base}?${common}&hourly=wind_speed_10m,wind_gusts_10m,precipitation&models=${m.id}`)));
  const main=await mainP;
  const res=await modAll;
  const times=main.hourly.time, idx=new Map(times.map((t,i)=>[t,i]));
  const pick=(h,k,id)=>h[k]||h[k+'_'+id]||null;
  const models=[];
  res.forEach((r,j)=>{
    if(r.status!=='fulfilled')return;
    const h=r.value.hourly,m=MODELS[j];
    const w=pick(h,'wind_speed_10m',m.id),g=pick(h,'wind_gusts_10m',m.id),p=pick(h,'precipitation',m.id);
    if(!w||!p)return;
    const A=()=>new Array(times.length).fill(null);const W=A(),G=A(),P=A();
    h.time.forEach((t,i)=>{const k=idx.get(t);if(k===undefined)return;W[k]=w[i];G[k]=g?g[i]:null;P[k]=p[i];});
    if(W.filter(v=>v!=null).length<24)return;
    models.push({...m,wind:W,gust:G,precip:P});
  });
  const H=main.hourly;
  if(!models.length)models.push({id:'best',name:'Best',full:'Open-Meteo Best Match',color:'#4fc3f7',wind:H.wind_speed_10m,gust:H.wind_gusts_10m,precip:H.precipitation});
  const C=main.current, Dy=main.daily;
  return {mode:'live',times:times.map(parseLocal),
    main:{temp:H.temperature_2m,dew:H.dew_point_2m,pp:H.precipitation_probability,precip:H.precipitation,wind:H.wind_speed_10m,gust:H.wind_gusts_10m,code:H.weather_code},
    models,

/* Demo-Daten: plausible Novemberwoche mit bewusst gemischten Tagen */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeDemo(){
  const r=rng(7);const t0=sod(new Date());
  const days=[
    {w:11.8,rain:[],amt:0,sp:.10},
    {w:5.5,rain:[],amt:0,sp:.10},
    {w:21,rain:[15,16,17,18],amt:.7,sp:.15},
    {w:8,rain:[12,13],amt:.4,sp:.20,cold:true},
    {w:5,rain:[],amt:0,sp:.22},
    {w:11,rain:[7,8,9,10,11,12,13,14,15],amt:1.3,sp:.30},
    {w:8.5,rain:[16],amt:.3,sp:.65}];
  const N=168,times=[],M={temp:[],dew:[],pp:[],precip:[],wind:[],gust:[],code:[]};
  const mods=MODELS.map(m=>({...m,wind:[],gust:[],precip:[],bias:1+(r()-.5)*.22,shift:Math.round((r()-.5)*3),miss:r()}));
  for(let i=0;i<N;i++){
    const d=Math.floor(i/24),h=i%24,Dd=days[d];const t=new Date(t0);t.setHours(i);times.push(t);
    const di=.6+.48*Math.max(0,Math.sin((h-7)/14*Math.PI));
    const w=Dd.w*di*(1+(r()-.5)*.1);
    const rainH=Dd.rain.includes(h);
    const temp=2.5+5*Math.max(0,Math.sin((h-8)/14*Math.PI))+(d%3)*.8-(Dd.cold&&h<11?2.5:0);
    const dew=temp-(Dd.cold&&h<12?.9+r()*.6:2.2+r()*2.5);
    M.wind.push(+w.toFixed(1));M.gust.push(+(w*1.75+r()*3).toFixed(1));
    M.temp.push(+temp.toFixed(1));M.dew.push(+dew.toFixed(1));
    M.precip.push(rainH?+(Dd.amt*(.5+r())).toFixed(1):0);
    M.pp.push(rainH?Math.round(55+r()*35):Math.round(r()*14));
    M.code.push(rainH?(Dd.amt>1?63:(d===2?80:61)):(w>17?3:(h>8&&h<16&&d%2?1:2)));
    mods.forEach(m=>{
      const sp=1+(r()-.5)*Dd.sp*2;const mw=w*m.bias*sp;
      m.wind.push(+mw.toFixed(1));m.gust.push(+(mw*1.75+r()*4).toFixed(1));
      const mr=Dd.rain.includes(h-m.shift)&&!(d>=3&&m.miss<Dd.sp*.7);
      m.precip.push(mr?+(Dd.amt*(.5+r())).toFixed(1):0);
    });
  }
  const now=new Date();const ci=Math.min(N-1,Math.floor((now-t0)/36e5));
  const dt=[],sr=[],ss=[],tx=[],tn=[],cd=[],pm=[];
  for(let d=0;d<7;d++){
    const day=new Date(t0);day.setDate(day.getDate()+d);dt.push(day);
    const a=new Date(day);a.setHours(7,32+d,0,0);sr.push(a);
    const b=new Date(day);b.setHours(16,33-d,0,0);ss.push(b);
    const sl=M.temp.slice(d*24,d*24+24);tx.push(Math.max(...sl));tn.push(Math.min(...sl));
    cd.push(days[d].rain.length?(days[d].amt>1?63:61):(days[d].w>17?3:2));
    pm.push(Math.max(...M.pp.slice(d*24,d*24+24)));
  }
  return {mode:'demo',times,main:M,models:mods,
    current:{temp:M.temp[ci],rh:84,code:M.code[ci],wind:M.wind[ci],gust:M.gust[ci],dir:245},
    daily:{time:dt,sunrise:sr,sunset:ss,tmax:tx,tmin:tn,code:cd,ppmax:pm},updated:new Date()};
}

/* ---------- Bewertung (Schweißampel) ---------- */
function evalHour(i,T){
  let n=0,ok=0,wind=0,rain=0;
  for(const m of D.models){
    const w=m.wind[i],g=m.gust[i],p=m.precip[i];
    if(w==null&&g==null)continue;
    n++;
    const wOK=(w==null||w<=T.wind)&&(g==null||g<=T.gust);
    const pOK=p==null||p<0.1;
    if(!wOK)wind++; if(!pOK)rain++; if(wOK&&pOK)ok++;
  }
  const f=n?ok/n:0;
  return{f,n,wind:n?wind/n:0,rain:n?rain/n:0,s:!n?'x':f>=.75?'g':f>=.4?'y':'r'};
}
const median=a=>{const s=a.filter(v=>v!=null).sort((x,y)=>x-y);return s.length?s[Math.floor(s.length/2)]:null;};
function evalDay(di){
  const day=D.daily.time[di],T=thr(),now=new Date(),key=dayKey(day);
  const hours=[];
  D.times.forEach((t,i)=>{
    if(dayKey(t)!==key)return;const h=t.getHours();
    if(h<S.start||h>=S.end)return;
    hours.push({i,h,t,past:t.getTime()+36e5<=now.getTime(),...evalHour(i,T)});
  });
  const act=hours.filter(x=>!x.past);
  const res={di,day,hours,act,sunset:D.daily.sunset[di]};
  if(!act.length){res.s='x';res.why='Arbeitszeit vorbei';return res;}
  const nr=act.filter(x=>x.s==='r').length, ny=act.filter(x=>x.s==='y').length;
  res.s=nr===0&&ny===0?'g':nr/act.length>.25?'r':'y';
  res.score=act.reduce((a,x)=>a+x.f,0)/act.length;
  const perHour=k=>act.map(x=>median(D.models.map(m=>m[k][x.i]))).filter(v=>v!=null);
  res.gustMax=Math.max(...perHour('gust'));res.windMax=Math.max(...perHour('wind'));
  res.rainH=act.filter(x=>x.rain>=.5).length;
  const vals=a=>act.map(x=>a[x.i]).filter(v=>v!=null);
  res.ppMax=Math.max(0,...vals(D.main.pp));
  res.tmin=Math.min(...vals(D.main.temp));res.tmax=Math.max(...vals(D.main.temp));
  const td=act.map(x=>D.main.temp[x.i]-D.main.dew[x.i]).filter(v=>!isNaN(v));
  res.dewWarn=td.length&&Math.min(...td)<2;
  const spreads=act.map(x=>{const g=D.models.map(m=>m.gust[x.i]).filter(v=>v!=null);return g.length>1?Math.max(...g)-Math.min(...g):0;});
  res.spread=spreads.reduce((a,b)=>a+b,0)/spreads.length;
  const lead=Math.round((sod(day)-sod(now))/864e5);
  let c=lead<=1?2:lead<=3?1:0; if(res.spread>12)c--; if(D.models.length<2)c=Math.min(c,1);
  res.conf=c>=2?'hoch':c===1?'mittel':'gering';
  // längstes gutes Zeitfenster
  let best=null,run=null;
  act.forEach(x=>{if(x.s==='g'){if(!run)run={from:x.h,to:x.h+1};else run.to=x.h+1;if(!best||run.to-run.from>best.to-best.from)best={...run};}else run=null;});
  res.best=best;
  const why=[];
  if(res.s==='g')why.push('Ruhig und trocken');
  else{
    const windyH=act.filter(x=>x.wind>=.5).length;
    if(windyH)why.push(`Böen bis ${Math.round(res.gustMax)} km/h`);
    if(res.rainH)why.push(`Regen ~${res.rainH} Std.`);
    if(!windyH&&!res.rainH)why.push('Modelle uneinig');
  }
  if(res.s!=='g'&&res.best&&res.best.to-res.best.from>=3)why.push(`gut ${res.best.from}–${res.best.to} Uhr`);
  if(act.length<hours.length)why.push(`noch ${act.length} Std.`);
  res.why=why.join(' · ');
  return res;
}

/* ---------- Wetter-Icons ---------- */
function wxText(c){
  if(c===0)return'Klar';if(c===1)return'Überwiegend klar';if(c===2)return'Teils bewölkt';if(c===3)return'Bedeckt';
  if(c===45||c===48)return'Nebel';if(c>=51&&c<=55)return'Nieselregen';if(c===56||c===57)return'Gefrierender Niesel';
  if(c===61)return'Leichter Regen';if(c===63)return'Regen';if(c===65)return'Starker Regen';if(c===66||c===67)return'Gefrierender Regen';
  if(c>=71&&c<=75)return'Schneefall';if(c===77)return'Schneegriesel';if(c>=80&&c<=82)return'Regenschauer';if(c===85||c===86)return'Schneeschauer';
  if(c===95)return'Gewitter';if(c>=96)return'Gewitter mit Hagel';return'–';
}
function wxIcon(c,s=56,night=false){
  const sun=(cx,cy,r)=>night
    ?`<path d="M${cx+2} ${cy-r-4}a${r+4} ${r+4} 0 1 0 ${r+3} ${2*r+2} ${r+1} ${r+1} 0 0 1-${r+3}-${2*r+2}z" fill="#dfe6ee"/>`
    :`<g stroke="#ffc94d" stroke-width="3" stroke-linecap="round"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#ffc94d" stroke="none"/>${[0,45,90,135,180,225,270,315].map(a=>{const q=a*Math.PI/180;return`<line x1="${(cx+(r+5)*Math.cos(q)).toFixed(1)}" y1="${(cy+(r+5)*Math.sin(q)).toFixed(1)}" x2="${(cx+(r+10)*Math.cos(q)).toFixed(1)}" y2="${(cy+(r+10)*Math.sin(q)).toFixed(1)}"/>`;}).join('')}</g>`;
  const cloud=(f='#cfd6de')=>`<path d="M17 48h31a11 11 0 0 0 1.5-21.9A15 15 0 0 0 20.6 24 12 12 0 0 0 17 48z" fill="${f}"/>`;
  const drops=(n,col='#5aa2ff')=>`<g stroke="${col}" stroke-width="3" stroke-linecap="round">${[22,32,42].slice(0,n).map(x=>`<line x1="${x}" y1="53" x2="${x-3}" y2="61"/>`).join('')}</g>`;
  let b='';
  if(c===0)b=sun(32,32,11);
  else if(c===1||c===2)b=sun(24,22,8)+cloud();
  else if(c===3)b=cloud('#aeb6bf');
  else if(c===45||c===48)b=`<g stroke="#aeb6bf" stroke-width="4" stroke-linecap="round"><line x1="12" y1="24" x2="52" y2="24"/><line x1="8" y1="34" x2="48" y2="34"/><line x1="16" y1="44" x2="56" y2="44"/></g>`;
  else if(c>=51&&c<=57)b=cloud('#aeb6bf')+drops(2);
  else if((c>=61&&c<=67)||(c>=80&&c<=82))b=cloud('#aeb6bf')+drops(3);
  else if((c>=71&&c<=77)||c===85||c===86)b=cloud('#aeb6bf')+`<g fill="#fff"><circle cx="22" cy="56" r="2.5"/><circle cx="32" cy="59" r="2.5"/><circle cx="42" cy="56" r="2.5"/></g>`;
  else if(c>=95)b=cloud('#8f98a3')+`<path d="M34 46l-7 11h6l-3 7 9-11h-6l3-7z" fill="#ffb020"/>`;
  else b=cloud();
  return`<svg width="${s}" height="${s}" viewBox="0 0 64 64">${b}</svg>`;
}
const arrow=(dir,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="transform:rotate(${dir+180}deg)"><path d="M12 3l6 16-6-4-6 4z" fill="#4fc3f7"/></svg>`;

/* ---------- Diagramm ---------- */
function chart(o){
  const {w,h,idx}=o;const n=idx.length;if(!n)return'';
  const pL=40,pR=40,pT=o.status?22:10,pB=26;const pw=w-pL-pR,ph=h-pT-pB;
  const X=k=>pL+(n===1?pw/2:k*pw/(n-1));
  let vmax=10;
  (o.lines||[]).forEach(L=>idx.forEach(i=>{const v=L.v(i);if(v!=null&&v>vmax)vmax=v;}));
  if(o.band)idx.forEach(i=>{const v=o.band.hi(i);if(v!=null&&v>vmax)vmax=v;});
  (o.thr||[]).forEach(t=>{if(t.v*1.15>vmax)vmax=t.v*1.15;});
  vmax=Math.ceil(vmax*1.08/10)*10;
  const Y=v=>pT+ph-(v/vmax)*ph;
  let pmax=2;idx.forEach(i=>{const p=o.bars?o.bars(i):0;if(p>pmax)pmax=p;});
  const BH=ph*.38;
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">`;
  // Nacht-Schattierung
  const colW=pw/Math.max(1,n-1);
  idx.forEach((i,k)=>{
    const t=D.times[i];const dI=D.daily.time.findIndex(d=>dayKey(d)===dayKey(t));
    if(dI<0)return;const night=t<D.daily.sunrise[dI]||t>=D.daily.sunset[dI];
    if(night)s+=`<rect x="${(X(k)-colW/2).toFixed(1)}" y="${pT}" width="${(colW+.5).toFixed(1)}" height="${ph}" fill="#0b0d10" opacity=".55"/>`;
  });
  // Gitter
  for(let v=0;v<=vmax;v+=vmax>60?20:10){
    s+=`<line x1="${pL}" x2="${w-pR}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#262b33" stroke-width="1"/>`;
    s+=`<text x="${pL-8}" y="${(Y(v)+4).toFixed(1)}" fill="#5d646e" font-size="12" text-anchor="end">${v}</text>`;
  }
  s+=`<text x="${w-pR+8}" y="${(pT+ph-BH-4).toFixed(1)}" fill="#5d646e" font-size="11">mm</text>`;
  s+=`<text x="${w-pR+8}" y="${(pT+ph-BH+12).toFixed(1)}" fill="#5d646e" font-size="12">${fmt(pmax,pmax<5?1:0)}</text>`;
  // Regen-Balken
  if(o.bars){const bw=Math.max(3,colW*.62);
    idx.forEach((i,k)=>{const p=o.bars(i)||0;if(p<.05)return;const bh=Math.max(2,p/pmax*BH);
      s+=`<rect x="${(X(k)-bw/2).toFixed(1)}" y="${(pT+ph-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="#3d7eff" opacity=".85"/>`;});}
  // Band (Modellstreuung)
  if(o.band){
    let up='',dn='';idx.forEach((i,k)=>{const a=o.band.hi(i),b=o.band.lo(i);if(a==null||b==null)return;up+=(up?'L':'M')+X(k).toFixed(1)+' '+Y(a).toFixed(1);dn=' L'+X(k).toFixed(1)+' '+Y(b).toFixed(1)+dn;});
    if(up)s+=`<path d="${up}${dn} Z" fill="${o.band.color}" opacity=".16"/>`;
  }
  // Grenzwerte
  (o.thr||[]).forEach(t=>{s+=`<line x1="${pL}" x2="${w-pR}" y1="${Y(t.v).toFixed(1)}" y2="${Y(t.v).toFixed(1)}" stroke="${t.color}" stroke-width="1.5" stroke-dasharray="6 5" opacity=".9"/>`+
    `<text x="${pL+8}" y="${(Y(t.v)-6).toFixed(1)}" fill="${t.color}" font-size="12" font-weight="600" stroke="#181b20" stroke-width="4" style="paint-order:stroke">${t.label}</text>`;});
  // Linien
  (o.lines||[]).forEach(L=>{let d='',pen=false;idx.forEach((i,k)=>{const v=L.v(i);if(v==null){pen=false;return;}d+=(pen?'L':'M')+X(k).toFixed(1)+' '+Y(v).toFixed(1);pen=true;});
    s+=`<path d="${d}" fill="none" stroke="${L.color}" stroke-width="${L.width||2.5}" stroke-linejoin="round" stroke-linecap="round" ${L.dash?`stroke-dasharray="${L.dash}"`:''}/>`;});
  // Status-Leiste
  if(o.status){const sw=Math.max(2,colW-2);idx.forEach((i,k)=>{const st=o.status(i);if(!st)return;
    s+=`<rect x="${(X(k)-sw/2).toFixed(1)}" y="2" width="${sw.toFixed(1)}" height="12" rx="3" fill="var(--${st.s})" opacity="${st.past?.3:1}"/>`;});}
  // Jetzt-Markierung
  const now=Date.now();const k0=idx.findIndex(i=>D.times[i].getTime()+36e5>now);
  if(k0>=0&&D.times[idx[k0]].getTime()<=now){const frac=(now-D.times[idx[k0]])/36e5;const xn=X(k0)+frac*colW;
    if(xn<=w-pR)s+=`<line x1="${xn.toFixed(1)}" x2="${xn.toFixed(1)}" y1="${pT}" y2="${pT+ph}" stroke="#e9ebee" stroke-width="1.5" opacity=".7"/><text x="${(xn+4).toFixed(1)}" y="${pT+12}" fill="#e9ebee" font-size="11" opacity=".8">jetzt</text>`;}
  // Achse
  idx.forEach((i,k)=>{const t=D.times[i],H=t.getHours();
    if(H%(o.every||3)===0)s+=`<text x="${X(k).toFixed(1)}" y="${h-7}" fill="${H===0?'#e9ebee':'#8b939d'}" font-size="12.5" text-anchor="middle" font-weight="${H===0?600:400}">${H===0?WD[t.getDay()]:pad(H)}</text>`;});
  return s+'</svg>';
}

function ringGeo(){
  const f=[];const R=6371;
  [10,25,50,100].forEach(km=>{
    const pts=[];for(let i=0;i<=96;i++){const b=i/96*2*Math.PI;const d=km/R,la=S.loc.lat*Math.PI/180,lo=S.loc.lon*Math.PI/180;
      const la2=Math.asin(Math.sin(la)*Math.cos(d)+Math.cos(la)*Math.sin(d)*Math.cos(b));
      const lo2=lo+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(la),Math.cos(d)-Math.sin(la)*Math.sin(la2));
      pts.push([lo2*180/Math.PI,la2*180/Math.PI]);}
    f.push({type:'Feature',properties:{km},geometry:{type:'LineString',coordinates:pts}});
    f.push({type:'Feature',properties:{label:km+' km'},geometry:{type:'Point',coordinates:pts[12]}});
  });
  return{type:'FeatureCollection',features:f};
}

/* Intensitätsraster (verkleinert) für die Bewegungsschätzung */

/* Blockvergleich A→B: für jeden Block die Verschiebung mit der kleinsten Abweichung */
function computeFlow(A,B,maxd,VM){
  const bs=8,gw=Math.ceil(A.w/bs),gh=Math.ceil(A.h/bs),n=gw*gh;
  const vx=new Float32Array(n),vy=new Float32Array(n),ok=new Uint8Array(n);
  const W=A.w,H=A.h,IA=A.I,IB=B.I;

    const x0=bx*bs,y0=by*bs;let sum=0;
    for(let y=y0;y<Math.min(H,y0+bs);y++)for(let x=x0;x<Math.min(W,x0+bs);x++)sum+=IA[y*W+x];
    if(sum<bs*bs*.06)continue;
    let best=1e9,bdx=0,bdy=0;
    for(let dy=-maxd;dy<=maxd;dy++)for(let dx=-maxd;dx<=maxd;dx++){
      let sad=(dx*dx+dy*dy)*.0008*sum;
      for(let y=y0;y<y0+bs&&sad<best;y++){if(y>=H)break;const yb=y+dy;
        for(let x=x0;x<x0+bs;x++){if(x>=W)break;const a=IA[y*W+x],xb=x+dx;
          sad+=(yb<0||yb>=H||xb<0||xb>=W)?a:Math.abs(a-IB[yb*W+xb]);}}
      if(sad<best){best=sad;bdx=dx;bdy=dy;}
    }
    // Subpixel-Verfeinerung per Parabel durch die Nachbarn
    const sadAt=(dx,dy)=>{let v=0;for(let y=y0;y<Math.min(H,y0+bs);y++){const yb=y+dy;for(let x=x0;x<Math.min(W,x0+bs);x++){const a=IA[y*W+x],xb=x+dx;v+=(yb<0||yb>=H||xb<0||xb>=W)?a:Math.abs(a-IB[yb*W+xb]);}}return v;};
    const c0=sadAt(bdx,bdy),xl=sadAt(bdx-1,bdy),xr=sadAt(bdx+1,bdy),yu=sadAt(bdx,bdy-1),yd=sadAt(bdx,bdy+1);
    const sub=(l,c,r)=>{const den=l-2*c+r;return den>1e-6?Math.max(-.5,Math.min(.5,.5*(l-r)/den)):0;};

  }

  const med=a=>{const s=[...a].sort((p,q)=>p-q);return s.length?s[s.length>>1]:0;};/*Median*/

    let sx=0,sy=0,sw=0;
    for(let yy=-2;yy<=2;yy++)for(let xx=-2;xx<=2;xx++){const X=bx+xx,Y=by+yy;if(X<0||Y<0||X>=gw||Y>=gh)continue;const j=Y*gw+X;if(!ok[j])continue;const wgt=1/(1+xx*xx+yy*yy);sx+=vx[j]*wgt;sy+=vy[j]*wgt;sw+=wgt;}

}
async function loadRadarFrames(){
  const gen=(RAD.gen||0)+1;RAD.gen=gen;
  (RAD.frames||[]).forEach(freeFrame);
  RAD.frames=[];RAD.ready=[];RAD.hold=0;RAD.tm=null;FLOW.a=FLOW.b=null;
  if(!MAP.getLayer('radar-flow'))MAP.addLayer(makeFlowLayer(),firstSymbolId());
  // Ausschnitt rund um den Ort (ca. ±450 × ±420 km), ~1 km pro Pixel
  const bw=Math.max(DE.w,S.loc.lon-6.5),be=Math.min(DE.e,S.loc.lon+6.5),bs=Math.max(DE.s,S.loc.lat-3.8),bn=Math.min(DE.n,S.loc.lat+3.8);
  FLOW.bbox=[bw,bs,be,bn];FLOW.quadDirty=true;
  const [x0,y0]=merc(bw,bs),[x1,y1]=merc(be,bn);
  const W=Math.round((be-bw)*100),H=Math.round(W*(y1-y0)/(x1-x0));
  const step=5*60e3,t0=Math.floor((Date.now()-7*60e3)/step)*step;
  showMsg('Lade Radarbilder …');
  const jobs=[];
  for(let k=-18;k<=24;k++){
    if(k>0&&k%2)continue;
    const t=t0+k*step;
    const url=`https://maps.dwd.de/geoserver/dwd/wms?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=dwd:Niederschlagsradar&STYLES=&FORMAT=image/png&TRANSPARENT=TRUE&CRS=EPSG:3857&BBOX=${x0.toFixed(0)},${y0.toFixed(0)},${x1.toFixed(0)},${y1.toFixed(0)}&WIDTH=${W}&HEIGHT=${H}&TIME=${new Date(t).toISOString().replace(/\.\d+Z$/,'.000Z')}`;
    const f={t,fc:k>0,k,ok:false,w:W,h:H};RAD.frames.push(f);
    jobs.push(fetch(url).then(r=>r.ok?r.blob():null).then(b=>b&&b.size>=1500?createImageBitmap(b):null).then(bmp=>{
      if(gen!==RAD.gen){bmp&&bmp.close&&bmp.close();return;}
      if(!bmp)return;
      f.bmp=bmp;f.grid=gridOf(bmp,FLOW.DS);f.ok=true;
      RAD.ready=RAD.frames.filter(x=>x.ok).sort((a,b)=>a.t-b.t);
      if(RAD.ready.length>=2)showMsg('');
    }).catch(()=>{}));
  }
  await Promise.all(jobs);
  if(gen!==RAD.gen)return;
  const fr=RAD.ready;
  if(!fr.length){showMsg('Radarbilder konnten nicht geladen werden.<br><small>Keine Verbindung zum DWD-Kartendienst.</small>');return;}
  const span=fr[fr.length-1].t-fr[0].t,lastObs=[...fr].reverse().find(f=>!f.fc);
  const p=lastObs&&span?Math.round((lastObs.t-fr[0].t)/span*100):100;
  $('#rslider').style.setProperty('--trk',`linear-gradient(90deg,#3a4049 0 ${p}%,#6b4e16 ${p}% 100%)`);
  // Bewegung zwischen aufeinanderfolgenden Bildern schätzen (portionsweise, damit die Oberfläche flüssig bleibt)
  for(let i=0;i<fr.length-1;i++){
    if(gen!==RAD.gen)return;
    const steps=Math.max(1,Math.round((fr[i+1].t-fr[i].t)/step));
    fr[i].flow=computeFlow(fr[i].grid,fr[i+1].grid,Math.min(FLOW.VM,5*steps+2),FLOW.VM);
    await new Promise(r=>setTimeout(r,0));
  }
  fr.forEach(f=>{f.grid=null;});
  RAD.flowReady=true;
}

function radarTick(ts){
  RAD.raf=requestAnimationFrame(radarTick);
  const dt=RAD.last?Math.min(100,ts-RAD.last):16;RAD.last=ts;
  if(D.mode==='demo'){demoTick(dt);return;}
  const fr=RAD.ready;if(fr.length<1||!MAP)return;
  const T0=fr[0].t,T1=fr[fr.length-1].t;
  if(RAD.tm==null)RAD.tm=T0;
  if(RAD.playing&&!RAD.drag&&fr.length>1){
    if(RAD.hold>0){RAD.hold-=dt;if(RAD.hold<=0)RAD.tm=T0;}
    else{RAD.tm+=dt*(5*60e3/330);if(RAD.tm>=T1){RAD.tm=T1;RAD.hold=1800;}}
  }
  const tm=Math.max(T0,Math.min(T1,RAD.tm));
  let i=0;while(i<fr.length-2&&fr[i+1].t<=tm)i++;
  const a=fr[i],b=fr[Math.min(i+1,fr.length-1)];
  FLOW.a=a;FLOW.b=b;FLOW.t=b===a?0:Math.max(0,Math.min(1,(tm-a.t)/(b.t-a.t)));
  MAP.triggerRepaint();
  const lastObs=[...fr].reverse().find(f=>!f.fc);
  setRTime(tm,!!lastObs&&tm>lastObs.t+60e3);
  if(!RAD.drag)$('#rslider').value=Math.round((tm-T0)/Math.max(1,T1-T0)*1000);
}

  if(fc){sp.textContent=`Vorhersage +${Math.max(5,diff)} min`;sp.className='fc';}

}

  const bg=document.createElement('canvas');bg.width=MW;bg.height=MH;const g=bg.getContext('2d');
  const gr=g.createRadialGradient(MW/2,MH/2,50,MW/2,MH/2,800);gr.addColorStop(0,'#1a1f25');gr.addColorStop(1,'#0c0e11');g.fillStyle=gr;g.fillRect(0,0,MW,MH);
  g.strokeStyle='rgba(255,255,255,.035)';g.lineWidth=1;for(let x=0;x<MW;x+=80){g.beginPath();g.moveTo(x,0);g.lineTo(x,MH);g.stroke();}for(let y=0;y<MH;y+=80){g.beginPath();g.moveTo(0,y);g.lineTo(MW,y);g.stroke();}
  const rr=rng(3);g.strokeStyle='rgba(120,140,160,.10)';g.lineWidth=2;
  for(let k=0;k<7;k++){g.beginPath();let x=rr()*MW,y=rr()*MH;g.moveTo(x,y);for(let s=0;s<14;s++){x+=(rr()-.4)*90;y+=(rr()-.5)*70;g.lineTo(x,y);}g.stroke();}
  DR.bg=bg;
  $('#rslider').style.setProperty('--trk',`linear-gradient(90deg,#3a4049 0 60%,#6b4e16 60% 100%)`);
}
function demoTick(dt){
  if(RAD.playing&&!RAD.drag){
    if(RAD.hold>0){RAD.hold-=dt;if(RAD.hold<=0)DR.t=-90;}
    else{DR.t+=dt/1000*24;if(DR.t>=60){DR.t=60;RAD.hold=1600;}}
  }
  if(!RAD.drag)$('#rslider').value=Math.round((DR.t+90)/150*1000);
  setRTime(Date.now()+DR.t*60e3,DR.t>2);
  demoDraw();
}
function demoDraw(){
  const{fw,fh,field,lut,img}=DR,sc=MW/fw,t=DR.t;
  field.fill(0);
  const vx=3.1,vy=-.55; // px pro Minute (Zugrichtung WSW → ONO)
  for(const c of DR.cells){
    for(const s of c.sub){
      const cx=(c.x+s.dx+vx*(t+90))/sc,cy=(c.y+s.dy+vy*(t+90))/sc;
      const rad=s.rad*(1+.18*Math.sin(t*.035+s.ph))/sc,amp=s.amp*(.8+.25*Math.sin(t*.05+s.ph*2));
      const R=rad*2.6;const x0=Math.max(0,cx-R|0),x1=Math.min(fw-1,cx+R|0),y0=Math.max(0,cy-R|0),y1=Math.min(fh-1,cy+R|0);
      if(x0>x1||y0>y1)continue;const inv=1/(rad*rad);
      for(let y=y0;y<=y1;y++){const dy=y-cy;let o=y*fw+x0;for(let x=x0;x<=x1;x++,o++){const dx=x-cx;const d2=(dx*dx+dy*dy)*inv;if(d2<6.8)field[o]+=amp*Math.exp(-d2);}}
    }
  }
  const d=img.data;
  for(let y=0,o=0;y<fh;y++){for(let x=0;x<fw;x++,o++){
    let v=field[o];if(v<.05){d[o*4+3]=0;continue;}
    const n=.72+.14*Math.sin(x*.31+t*.03)*Math.sin(y*.27-x*.09)+.2*Math.sin((x-vx*t/sc)*.21+Math.sin(y*.17)*1.7)*Math.sin(y*.23-(x-vx*t/sc)*.07);
    v=Math.min(1,v*n*.42);const li=(v*255)|0;d[o*4]=lut[li*4];d[o*4+1]=lut[li*4+1];d[o*4+2]=lut[li*4+2];d[o*4+3]=lut[li*4+3];}}
  DR.off.getContext('2d').putImageData(img,0,0);
  const cv=$('#demoCanvas'),q=(window.devicePixelRatio||1)*scale>1.2?2:1;
  if(cv.width!==MW*q){cv.width=MW*q;cv.height=MH*q;}
  const g=cv.getContext('2d');g.setTransform(q,0,0,q,0,0);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
  g.drawImage(DR.bg,0,0);g.globalAlpha=.9;g.drawImage(DR.off,0,0,MW,MH);g.globalAlpha=1;
}

/* Radar-Bedienung */
$('#rplay').onclick=()=>{RAD.playing=!RAD.playing;RAD.hold=0;setPlayIcon();};
const sl=$('#rslider');
sl.addEventListener('pointerdown',()=>{RAD.drag=true;});
sl.addEventListener('input',()=>{const v=+sl.value/1000;if(D.mode==='demo'){DR.t=-90+v*150;}else{const fr=RAD.ready;if(fr.length)RAD.tm=fr[0].t+v*(fr[fr.length-1].t-fr[0].t);}});
const endDrag=()=>{if(!RAD.drag)return;RAD.drag=false;RAD.playing=false;setPlayIcon();};
sl.addEventListener('pointerup',endDrag);sl.addEventListener('change',endDrag);
$('#zin').onclick=()=>{if(MAP&&D.mode==='live'){MAP.zoomIn();return;}S.zoom=Math.min(10,S.zoom+1);saveSettings();RAD.built=false;radarStart();};
$('#zout').onclick=()=>{if(MAP&&D.mode==='live'){MAP.zoomOut();return;}S.zoom=Math.max(6,S.zoom-1);saveSettings();RAD.built=false;radarStart();};

/* ---------- Skalierung & Start ---------- */
let scale=1;
function fit(){scale=Math.min(innerWidth/1280,innerHeight/720);$('#stage').style.transform=`scale(${scale})`;}
addEventListener('resize',()=>{fit();if(D)renderOverview();});

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-close]')||t.id==='overlay'){hideOverlay();return;}
  const tab=t.closest('#tabs button');if(tab){setPage(+tab.dataset.p);return;}
  const card=t.closest('.ac,.vd,.wk');if(card){openDetail(+card.dataset.di);return;}
  if(t.closest('[data-privacy]')){openPrivacy(false);return;}
  if(t.closest('[data-about]')){openPrivacy(true);return;}
  if(t.closest('#gear')||t.closest('#locBtn')){openSettings();return;}
});

let ONLINE=null;
async function refresh(rebuildRadar){
  if(S.loc){
    try{D=await loadLive();ONLINE=true;}
    catch(e){if(!D||D.mode==='demo')D=makeDemo();}
  }
  if(!D)return;
  renderAll();
  const L=$('#loading');if(L)L.remove();
  if(rebuildRadar||page===2){RAD.built=false;if(page===2)radarStart();}
}
/* Ohne gewählten Ort: Startbildschirm statt Wetterdaten (kein voreingestellter Ort) */
function showNoLoc(){
  const L=$('#loading');if(!L)return;
  L.innerHTML=`<div style="text-align:center;max-width:420px;padding:0 24px">
    <div style="font-size:26px;font-weight:700;color:var(--tx);margin-bottom:8px">Willkommen bei Schweißwetter</div>
    <div style="font-size:16px;line-height:1.5;margin-bottom:18px">Wähle zuerst den Ort, für den das Wetter bewertet werden soll – per Postleitzahl oder Ortsname.</div>
    <button class="btn pri" id="noLocBtn" style="padding:0 28px">Ort wählen</button>
    <div style="margin-top:16px"><button class="linkbtn" data-privacy>Datenschutz</button> · <button class="linkbtn" data-about>Über dieses Projekt</button></div></div>`;
  $('#noLocBtn').onclick=openSettings;
}
(async function init(){
  fit();tick();setInterval(tick,1000);setPlayIcon();
  if(S.loc)await refresh(false);
  else{
    // Nur prüfen, ob Wetterdaten erreichbar sind (ohne Ortsbezug) – sonst Demo-Modus
    ONLINE=await getJSON('https://api.open-meteo.com/v1/forecast?latitude=0&longitude=0&current=temperature_2m',6000).then(()=>true).catch(()=>false);
    if(!ONLINE){D=makeDemo();renderAll();const L=$('#loading');if(L)L.remove();}
    else showNoLoc();
  }
  if(location.hash==='#ampel')setPage(1);else if(location.hash==='#radar')setPage(2);
  const needLoc=!S.loc&&ONLINE;
  if(!introSeen())openIntro(needLoc?openSettings:null);else if(needLoc)openSettings();
  setInterval(()=>{if(D&&D.mode==='live')refresh(false);else if(D)renderAll();},15*60e3);
  setInterval(()=>{if(D)renderOverview();},60e3);
  setInterval(()=>{if(D&&D.mode==='live'&&MAP)loadRadarFrames();},10*60e3);
})();


/* ============================================================
   Handy-Anpassungen (überschreiben die Desktop-Darstellung)
   ============================================================ */
function fit(){scale=1;}
function setPage(p){
  page=Math.max(0,Math.min(2,p));
  $$('.page').forEach((el,i)=>el.classList.toggle('on',i===page));
  $$('#tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.p===page));
  window.scrollTo(0,0);
  if(page===2){radarStart();if(MAP)setTimeout(()=>MAP.resize(),30);}else radarStop();
  if(page===0&&D)renderOverview();
}
function renderOverview(){
  const c=D.current,now=new Date();
  const di0=Math.max(0,D.daily.time.findIndex(d=>dayKey(d)===dayKey(now)));
  const night=now<D.daily.sunrise[di0]||now>=D.daily.sunset[di0];
  const ci=D.times.findIndex(t=>t.getTime()+36e5>now.getTime());
  const sun=now<D.daily.sunset[di0]?['Sonnenunterg.',hm(D.daily.sunset[di0])]:['Sonnenaufg.',hm(D.daily.sunrise[Math.min(di0+1,6)])];
  const dewGap=ci>=0?D.main.temp[ci]-D.main.dew[ci]:null;const T=thr();
  $('#nowCard').innerHTML=`
    <div class="cardTitle"><span>Jetzt</span></div>
    <div id="nowMain">${wxIcon(c.code,64,night)}<div><div id="nowTemp" class="num">${fmt(c.temp)}°</div><div id="nowDesc">${wxText(c.code)}</div></div></div>
    <div class="stats">
      <div class="stat"><span>Wind</span><b class="num">${arrow(c.dir,16)}${fmt(c.wind)}<small>${compass(c.dir)}</small></b></div>
      <div class="stat"><span>Böen</span><b class="num" style="color:${c.gust>T.gust?'var(--r)':'inherit'}">${fmt(c.gust)}<small>km/h</small></b></div>
      <div class="stat"><span>Feuchte</span><b class="num">${fmt(c.rh)}<small>%</small></b></div>
      <div class="stat"><span>Taupunkt-Abst.</span><b class="num" style="color:${dewGap!=null&&dewGap<2?'var(--y)':'inherit'}">${fmt(dewGap,1)}<small>K</small></b></div>
      <div class="stat"><span>${sun[0]}</span><b class="num">${sun[1]}</b></div>
      <div class="stat"><span>Heute</span><b class="num">${fmt(D.daily.tmin[di0])}°<small>/</small>${fmt(D.daily.tmax[di0])}°</b></div>
    </div>`;
  $('#vdSub').textContent=`${pad(S.start)}–${pad(S.end)} Uhr · Wind ≤ ${T.wind} · Böen ≤ ${T.gust} km/h${S.screen?' · mit Windschutz':''}`;
  const vd=(e,title)=>e?`<div class="vd" data-di="${e.di}"><div class="top"><div class="dot bg-${e.s} c-${e.s}"></div><div><h4>${title}</h4><p class="c-${e.s}">${STATUS_TX[e.s]}</p></div></div><small>${e.why||''}</small></div>`:'';
  $('#verdict').innerHTML=vd(EV[0],'Heute')+vd(EV[1],'Morgen');
  $('#weekStrip').innerHTML=EV.map((e,k)=>`<div class="wk" data-di="${k}"><span>${k===0?'Ht':WD[e.day.getDay()]}</span><i class="bg-${e.s}"></i></div>`).join('');
  const nextGood=EV.find((e,k)=>k>1&&e.s==='g');
  if(nextGood&&EV[0].s!=='g'&&EV[1].s!=='g')$('#vdSub').innerHTML+=`<br><span style="color:var(--g);font-weight:600">Nächster guter Tag: ${WDL[nextGood.day.getDay()]}</span>`;
  const start=Math.max(0,ci);const idx=[];for(let i=start;i<Math.min(D.times.length,start+25);i++)idx.push(i);
  const box=$('#chart24');
  box.innerHTML=chart({w:box.clientWidth||360,h:box.clientHeight||210,idx,every:6,
    band:{lo:modelSeries('gust',v=>Math.min(...v)),hi:modelSeries('gust',v=>Math.max(...v)),color:'#ffb020'},
    lines:[{v:modelSeries('wind',median),color:'#4fc3f7',width:2},{v:modelSeries('gust',median),color:'#ffb020',width:2.5}],
    bars:modelSeries('precip',median),
    thr:[{v:T.gust,color:'#ef5a5a',label:`Böen ${T.gust}`},{v:T.wind,color:'#4fc3f7',label:`Wind ${T.wind}`}]});
}
function renderAmpel(){
  const T=thr();
  $('#ampSub').textContent=`${pad(S.start)}–${pad(S.end)} Uhr · Wind ≤ ${T.wind}, Böen ≤ ${T.gust} km/h${S.screen?' · Windschutz':''}`;
  $('#ampCards').innerHTML=EV.map((e,k)=>{
    const strip=e.hours.map(x=>`<i class="bg-${x.s}${x.past?' past':''}"></i>`).join('');
    const kv=e.s==='x'?'':`<div class="kv">
      <div>Böen<b class="num">${fmt(e.gustMax)}</b></div>
      <div>Wind<b class="num">${fmt(e.windMax)}</b></div>
      <div>Regen<b class="num">${e.rainH?e.rainH+' h':'–'}</b></div>
      <div>Sicher<b>${e.conf}</b></div></div>`;
    return`<div class="ac c-${e.s}" data-di="${k}">
      <div class="row1"><div class="lamp"></div>
        <div class="mid"><div class="d1">${k===0?'Heute':k===1?'Morgen':WDL[e.day.getDay()]}<small>${e.day.getDate()}.${e.day.getMonth()+1}. · ${fmt(e.tmin)}…${fmt(e.tmax)}°</small></div>
          <div class="lbl">${STATUS_TX[e.s]}</div><div class="why">${e.why||''}</div></div>
        <div class="chev">›</div></div>
      <div class="hstrip">${strip}</div><div class="hlab"><span>${pad(S.start)}</span><span>${pad(S.end)}</span></div>
      ${kv}
      ${e.dewWarn&&e.s!=='x'?'<div class="warn">⚠ Kondensat am Werkstück möglich</div>':''}
    </div>`;}).join('');
  $('#ampModels').textContent=`Bewertet mit ${D.models.length} Wettermodell${D.models.length>1?'en':''}: ${D.models.map(m=>m.full).join(', ')}. Grün = mind. 75 % der Modelle im Grenzbereich.`;
}
function openDetail(di){
  plainSheet();
  const e=EV[di];if(!e)return;const T=thr();
  const key=dayKey(e.day);const idx=[];D.times.forEach((t,i)=>{if(dayKey(t)===key&&t.getHours()>=Math.max(0,S.start-2)&&t.getHours()<=Math.min(23,S.end+1))idx.push(i);});
  const stMap=new Map(e.hours.map(x=>[x.i,x]));
  const rows=D.models.map(m=>{
    const hrs=e.act.length?e.act:e.hours;
    const g=Math.max(...hrs.map(x=>m.gust[x.i]).filter(v=>v!=null));
    const rh=hrs.filter(x=>(m.precip[x.i]||0)>=.1).length;
    const ok=hrs.filter(x=>(m.wind[x.i]==null||m.wind[x.i]<=T.wind)&&(m.gust[x.i]==null||m.gust[x.i]<=T.gust)&&(m.precip[x.i]||0)<.1).length;
    const r=ok/hrs.length;const st=r>=.99?'g':r>=.6?'y':'r';
    return`<tr><td><b class="sw" style="background:${m.color}"></b>${m.name}</td><td class="num">${fmt(g)} km/h</td><td>${rh?rh+' h':'trocken'}</td><td><span class="pill bg-${st}">${STATUS_TX[st]}</span></td></tr>`;}).join('');
  $('#sheet').innerHTML=`
    <div class="sheetHead"><h3>${WDL[e.day.getDay()]}, ${e.day.getDate()}. ${MON[e.day.getMonth()]}<small style="color:var(--${e.s})">● ${STATUS_TX[e.s]}${e.why?' – '+e.why:''}</small></h3><button class="xbtn" data-close>✕</button></div>
    <div class="cardTitle"><span>Böen je Modell · km/h</span><span class="lg">${D.models.map(m=>`<span><b style="background:${m.color}"></b>${m.name}</span>`).join('')}</span></div>
    <div id="detChart"></div>
    <table class="mt"><thead><tr><th>Modell</th><th>Böen max</th><th>Regen</th><th>Urteil</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="note">Sicherheit: <b>${e.conf||'–'}</b>${e.spread!=null?` · Modelle weichen bei den Böen im Schnitt um ${fmt(e.spread)} km/h ab`:''}. ${e.dewWarn?'Taupunkt nahe Lufttemperatur: Werkstück trocknen bzw. vorwärmen.':''}</div>`;
  showOverlay();
  const w=Math.min(608,$('#sheet').clientWidth-32);
  $('#detChart').innerHTML=chart({w,h:230,idx,every:3,lines:D.models.map(m=>({v:i=>m.gust[i],color:m.color,width:2})),bars:modelSeries('precip',median),
    thr:[{v:T.gust,color:'#ef5a5a',label:`Grenze ${T.gust}`}],status:i=>stMap.get(i)});
}

(function(){let y0=null;const sh=$('#sheet');
  sh.addEventListener('touchstart',e=>{y0=sh.scrollTop<=0?e.touches[0].clientY:null;},{passive:true});
  sh.addEventListener('touchend',e=>{if(y0!=null&&e.changedTouches[0].clientY-y0>90)hideOverlay();y0=null;},{passive:true});})();
</script>
